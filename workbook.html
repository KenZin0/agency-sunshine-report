  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

    <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width: 1400px; margin: 0 auto; padding: 30px 26px 90px; min-width: 0;\">\n\n  <div style=\"display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; border-top: 2px solid #1F3864; padding-top: 12px; margin-bottom: 22px;\">\n    <h1 style=\"margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1.15; font-weight: 700; color: #1F3864;\">{{ sheetTitle }}<\u002Fh1>\n    <div style=\"flex: 1; min-width: 120px;\"><\u002Fdiv>\n    <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8B95A6;\">{{ sheetTag }}<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-family: Georgia, 'Times New Roman', serif; font-size: 16.5px; line-height: 1.6; color: #4A5262; max-width: 92ch; margin: 0 0 26px; text-wrap: pretty;\">{{ sheetIntro }}<\u002Fp>\n\n  <sc-if value=\"{{ isSummary }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: grid; gap: 26px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: 1px; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n        <sc-for list=\"{{ headline }}\" as=\"h\" hint-placeholder-count=\"7\">\n          <div style=\"background: #FFFFFF; padding: 20px 20px 22px; animation: wb-in 600ms cubic-bezier(.22,.61,.36,1) both;\">\n            <div style=\"font-family: Georgia, 'Times New Roman', serif; font-size: 34px; line-height: 1.05; font-weight: 700; color: #1F3864;\">{{ h.big }}<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #B3261E; font-weight: 700; margin-top: 5px;\">{{ h.small }}<\u002Fdiv>\n            <div style=\"font-size: 12.5px; color: #5A5A5A; line-height: 1.5; margin-top: 9px;\">{{ h.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 26px; align-items: start;\">\n        <div style=\"display: grid; gap: 1px; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n          <div style=\"background: #F7F9FC; padding: 11px 16px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1F3864; font-weight: 700;\">Sheet guide<\u002Fdiv>\n          <sc-for list=\"{{ guide }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <div style=\"background: #FFFFFF; padding: 13px 16px; display: grid; grid-template-columns: 152px minmax(0, 1fr); gap: 14px; align-items: baseline;\">\n              <div style=\"font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; color: #1F3864; font-weight: 700;\">{{ g.sheet }}<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #4A5262; line-height: 1.55;\">{{ g.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 16px;\">\n          <div style=\"border: 1px solid #D8DEE9; border-left: 3px solid #BF9000; background: #FFFDF6; padding: 16px 18px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A6D00; font-weight: 700; margin-bottom: 8px;\">Scope note<\u002Fdiv>\n            <div style=\"font-size: 13.5px; line-height: 1.6; color: #4A5262;\">{{ scopeNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #D8DEE9; padding: 16px 18px; display: grid; gap: 10px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1F3864; font-weight: 700;\">Rows behind this workbook<\u002Fdiv>\n            <sc-for list=\"{{ rowTally }}\" as=\"r\" hint-placeholder-count=\"9\">\n              <div style=\"display: grid; grid-template-columns: 62px minmax(0, 1fr) 62px; gap: 10px; align-items: center; font-size: 12.5px;\">\n                <div style=\"font-weight: 700; color: #1F3864;\">{{ r.name }}<\u002Fdiv>\n                <div style=\"height: 8px; background: #EEF2F8;\"><div style=\"height: 100%; width: {{ r.w }}; background: #1F3864; transform-origin: left; animation: wb-grow 700ms cubic-bezier(.22,.61,.36,1) both;\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"text-align: right; font-variant-numeric: tabular-nums; color: #5A5A5A;\">{{ r.count }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTable }}\">\n    <div style=\"display: grid; gap: 14px;\">\n      <div style=\"display: flex; gap: 12px; align-items: center; flex-wrap: wrap;\">\n        <input type=\"search\" value=\"{{ q }}\" sc-camel-on-input=\"{{ setQ }}\" placeholder=\"Filter rows…\" style=\"font-family: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid #D8DEE9; background: #FFFFFF; color: #23282F; min-width: 240px;\">\n        <sc-for list=\"{{ toggles }}\" as=\"tg\" hint-placeholder-count=\"2\">\n          <button type=\"button\" sc-camel-on-click=\"{{ tg.go }}\" style=\"font-family: inherit; font-size: 12px; padding: 9px 13px; border: 1px solid {{ tg.edge }}; background: {{ tg.bg }}; color: {{ tg.fg }}; cursor: pointer; font-weight: 700;\">{{ tg.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"flex: 1;\"><\u002Fdiv>\n        <div style=\"font-size: 12px; color: #8B95A6;\">{{ rowCountLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid #D8DEE9; overflow-x: auto;\">\n        <div style=\"min-width: {{ table.minWidth }};\">\n          <div style=\"display: grid; grid-template-columns: {{ table.grid }}; background: #F7F9FC; border-bottom: 1px solid #D8DEE9; position: sticky; top: 0;\">\n            <sc-for list=\"{{ table.cols }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.sort }}\" style=\"border: 0; border-right: 1px solid #E6EBF2; background: none; font-family: inherit; text-align: {{ c.align }}; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: {{ c.fg }}; padding: 11px 12px; cursor: pointer; line-height: 1.3;\" style-hover=\"color: #B3261E;\">{{ c.label }}{{ c.arrow }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ table.rows }}\" as=\"r\" hint-placeholder-count=\"12\">\n            <div style=\"border-bottom: 1px solid #EEF2F8; background: {{ r.bg }};\">\n              <div sc-camel-on-click=\"{{ r.go }}\" style=\"display: grid; grid-template-columns: {{ table.grid }}; cursor: {{ r.cursor }};\" style-hover=\"background: #F7F9FC;\">\n                <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <div style=\"padding: 10px 12px; font-size: 13px; color: {{ c.fg }}; text-align: {{ c.align }}; font-weight: {{ c.weight }}; font-variant-numeric: tabular-nums; min-width: 0; display: grid; gap: 5px; align-content: center;\">\n                    <div style=\"overflow: hidden; text-overflow: ellipsis; white-space: {{ c.wrap }};\">{{ c.text }}<\u002Fdiv>\n                    <sc-if value=\"{{ c.bar }}\">\n                      <div style=\"height: 5px; background: #EEF2F8;\"><div style=\"height: 100%; width: {{ c.w }}; background: {{ c.barColor }}; transform-origin: left; animation: wb-grow 650ms cubic-bezier(.22,.61,.36,1) both;\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.open }}\">\n                <div style=\"background: #F7F9FC; border-top: 1px solid #D8DEE9; padding: 16px 18px; display: grid; gap: 12px; animation: wb-in 300ms ease both;\">\n                  <sc-for list=\"{{ r.detail }}\" as=\"dt\" hint-placeholder-count=\"3\">\n                    <div style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: baseline;\">\n                      <div style=\"font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #1F3864; font-weight: 700; line-height: 1.4;\">{{ dt.label }}<\u002Fdiv>\n                      <div style=\"font-size: 13.5px; line-height: 1.6; color: #4A5262; border-left: 2px solid {{ dt.edge }}; padding-left: 14px;\">{{ dt.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 12.5px; color: #8B95A6; line-height: 1.6; max-width: 110ch;\">{{ table.note }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isExplorer }}\">\n    <div style=\"display: grid; gap: 22px;\">\n      <div style=\"display: grid; gap: 10px;\">\n        <div style=\"font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8B95A6;\">Agency log<\u002Fdiv>\n        <div style=\"display: flex; gap: 1px; flex-wrap: wrap; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n          <sc-for list=\"{{ agencyBtns }}\" as=\"a\" hint-placeholder-count=\"9\">\n            <button type=\"button\" sc-camel-on-click=\"{{ a.go }}\" style=\"border: 0; background: {{ a.bg }}; color: {{ a.fg }}; font-family: inherit; font-size: 13px; font-weight: 700; padding: 11px 18px; cursor: pointer; letter-spacing: 0.04em;\" style-hover=\"background: #EEF2F8;\">{{ a.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasSegments }}\">\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px;\">\n            <sc-for list=\"{{ segBtns }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ s.go }}\" style=\"border: 1px solid {{ s.edge }}; background: {{ s.bg }}; color: {{ s.fg }}; font-family: inherit; font-size: 12px; font-weight: 700; padding: 7px 12px; cursor: pointer;\">{{ s.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 1px; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n        <sc-for list=\"{{ statCards }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <div style=\"background: #FFFFFF; padding: 16px 18px 18px; animation: wb-in 500ms cubic-bezier(.22,.61,.36,1) both;\">\n            <div style=\"font-family: Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; font-weight: 700; color: {{ s.color }};\">{{ s.value }}<\u002Fdiv>\n            <div style=\"font-size: 11.5px; color: #5A5A5A; line-height: 1.45; margin-top: 8px;\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 24px; align-items: start;\">\n        <div style=\"border: 1px solid #D8DEE9; padding: 18px 20px 20px; display: grid; gap: 14px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1F3864; font-weight: 700;\">Time to complete<\u002Fdiv>\n            <div style=\"font-size: 11.5px; color: #8B95A6;\">calendar days · {{ explorerDone }} completed rows<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; gap: 7px;\">\n            <sc-for list=\"{{ hist }}\" as=\"h\" hint-placeholder-count=\"11\">\n              <div style=\"display: grid; grid-template-columns: 74px minmax(0, 1fr) 96px; gap: 10px; align-items: center;\">\n                <div style=\"font-size: 12px; color: #4A5262; text-align: right; font-variant-numeric: tabular-nums;\">{{ h.label }}<\u002Fdiv>\n                <div style=\"height: 15px; background: #F2F5F9;\"><div style=\"height: 100%; width: {{ h.w }}; background: {{ h.color }}; transform-origin: left; animation: wb-grow 700ms cubic-bezier(.22,.61,.36,1) both;\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"font-size: 12px; color: #5A5A5A; font-variant-numeric: tabular-nums;\">{{ h.count }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #8B95A6; line-height: 1.5;\">Green = inside the ten-working-day guidepost. Red = past thirty calendar days.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; gap: 24px;\">\n          <div style=\"border: 1px solid #D8DEE9; padding: 18px 20px 20px; display: grid; gap: 14px;\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n              <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1F3864; font-weight: 700;\">Requests received<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #8B95A6;\">by month · peak {{ monthPeak }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: flex-end; gap: 2px; height: 120px;\">\n              <sc-for list=\"{{ months }}\" as=\"m\" hint-placeholder-count=\"28\">\n                <div title=\"{{ m.title }}\" style=\"flex: 1; height: {{ m.h }}; min-width: 4px; background: {{ m.color }}; transform-origin: bottom; animation: wb-rise 650ms cubic-bezier(.22,.61,.36,1) both;\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; font-size: 11px; color: #8B95A6; border-top: 1px solid #EEF2F8; padding-top: 7px;\">\n              <span>{{ monthFirst }}<\u002Fspan>\n              <span>{{ monthLast }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border: 1px solid #D8DEE9; padding: 18px 20px 20px; display: grid; gap: 11px;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1F3864; font-weight: 700;\">Disposition as logged<\u002Fdiv>\n            <sc-for list=\"{{ statusRows }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 74px; gap: 12px; align-items: center; font-size: 12.5px;\">\n                <div style=\"color: #4A5262; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ s.label }}<\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 7px; align-items: center;\">\n                  <div style=\"height: 7px; background: #F2F5F9;\"><div style=\"height: 100%; width: {{ s.w }}; background: #1F3864; transform-origin: left; animation: wb-grow 700ms ease both;\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size: 11.5px; color: #5A5A5A; text-align: right; font-variant-numeric: tabular-nums;\">{{ s.count }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 12.5px; color: #8B95A6; line-height: 1.6; max-width: 110ch;\">Computed from every produced log row, windowed to requests received 1/1/2024–4/22/2026. Blank completion dates are treated as pending or unrecorded and excluded from duration statistics.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isFindings }}\">\n    <div style=\"display: grid; gap: 1px; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n      <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"12\">\n        <div style=\"background: #FFFFFF;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ f.go }}\" style=\"width: 100%; border: 0; background: none; font-family: inherit; text-align: left; display: grid; grid-template-columns: 34px minmax(0, 1fr) 26px; gap: 14px; align-items: baseline; padding: 16px 18px; cursor: pointer;\" style-hover=\"background: #F7F9FC;\">\n            <span style=\"font-family: Georgia, serif; font-size: 15px; font-weight: 700; color: #BF9000;\">{{ f.num }}<\u002Fspan>\n            <span style=\"font-family: Georgia, 'Times New Roman', serif; font-size: 18.5px; line-height: 1.4; font-weight: 700; color: #1F3864;\">{{ f.title }}<\u002Fspan>\n            <span style=\"font-size: 15px; color: #8B95A6; text-align: right;\">{{ f.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\">\n            <div style=\"padding: 0 18px 20px 62px; display: grid; gap: 12px; animation: wb-in 300ms ease both;\">\n              <div style=\"font-size: 14.5px; line-height: 1.68; color: #23282F; max-width: 88ch; text-wrap: pretty;\">{{ f.detail }}<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #5A5A5A; border-left: 2px solid #BF9000; padding-left: 12px; line-height: 1.5;\">Source: {{ f.source }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMethod }}\">\n    <div style=\"display: grid; gap: 20px; max-width: 108ch;\">\n      <div style=\"display: grid; gap: 1px; background: #D8DEE9; border: 1px solid #D8DEE9;\">\n        <sc-for list=\"{{ method }}\" as=\"m\" hint-placeholder-count=\"8\">\n          <div style=\"background: #FFFFFF; padding: 16px 18px; display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 20px; align-items: baseline;\">\n            <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #1F3864; font-weight: 700; line-height: 1.4;\">{{ m.term }}<\u002Fdiv>\n            <div style=\"font-size: 14px; line-height: 1.68; color: #4A5262; text-wrap: pretty;\">{{ m.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #8B95A6;\">{{ methodFoot }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"background: #1F3864; color: #C6D2E6;\">\n  <div style=\"max-width: 1400px; margin: 0 auto; padding: 26px; display: flex; gap: 26px; flex-wrap: wrap; align-items: baseline; font-size: 12.5px;\">\n    <div style=\"font-family: Georgia, serif; font-size: 15px; color: #FFFFFF;\">Institute for Reforming Government · Center for Investigative Oversight<\u002Fdiv>\n    <div style=\"flex: 1;\"><\u002Fdiv>\n    <a href=\"Agency_Sunshine_Report.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color: #FFFFFF; border-bottom-color: #BF9000;\">PDF report ↓<\u002Fa>\n    <a href=\"IRG_Public_Records_Tracking_Workbook.xlsx\" style=\"color: #FFFFFF; border-bottom-color: #BF9000;\">Excel workbook ↓<\u002Fa>\n    <span>Produced July 24, 2026<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"border-top: 1px solid rgba(255,255,255,0.18);\">\n    <div style=\"max-width: 1400px; margin: 0 auto; padding: 20px 26px 28px; display: flex; gap: 12px; flex-wrap: wrap;\">\n      <a href=\"https://reforminggovernment.org/center-for-investigative-oversight/\" style=\"background: #BF9000; color: #1F3864; border: 1px solid #BF9000; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; padding: 13px 20px; line-height: 1.3;\" style-hover=\"background: #FFFFFF; border-color: #FFFFFF; color: #1F3864;\">Return to IRG Center for Investigative Oversight<\u002Fa>\n      <a href=\"https://www.irgcourtwatch.org\" style=\"background: transparent; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.45); font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; padding: 13px 20px; line-height: 1.3;\" style-hover=\"background: #FFFFFF; border-color: #FFFFFF; color: #1F3864;\">IRG Court Watch<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { sheet: 'summary', q: '', sortKey: null, sortDir: 1, agency: 'DOT', seg: 'all', showSegs: true, openRow: null, openFinding: 0 };\n\n  componentDidMount() {\n    this.onScroll = () => {\n      const past = document.documentElement.scrollTop > 600;\n      if (past !== !!this.state.scrolled) this.setState({ scrolled: past });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    if (!window.WB) {\n      this.timer = setInterval(() => { if (window.WB) { clearInterval(this.timer); this.forceUpdate(); } }, 60);\n    }\n  }\n  componentWillUnmount() { clearInterval(this.timer); window.removeEventListener('scroll', this.onScroll); }\n\n  set(patch) { this.setState(patch); }\n  fmt(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }\n  dayColor(v) { if (v == null) return '#8B95A6'; if (v <= 10) return '#2E6B4F'; if (v <= 30) return '#8A6D00'; return '#B3261E'; }\n\n  sortRows(rows, key, dir, textKeys) {\n    if (!key) return rows;\n    const out = rows.slice();\n    out.sort((a, b) => {\n      const x = a[key], y = b[key];\n      if (textKeys && textKeys.indexOf(key) >= 0) return String(x || '').localeCompare(String(y || '')) * dir;\n      const nx = x == null ? -Infinity : +x, ny = y == null ? -Infinity : +y;\n      return (nx - ny) * dir;\n    });\n    return out;\n  }\n\n  colDefs(defs) {\n    const { sortKey, sortDir } = this.state;\n    return defs.map(d => ({\n      label: d.label, align: d.align || 'left',\n      fg: sortKey === d.key ? '#B3261E' : '#1F3864',\n      arrow: sortKey === d.key ? (sortDir > 0 ? ' ↑' : ' ↓') : '',\n      sort: () => this.setState(s => ({ sortKey: d.key, sortDir: s.sortKey === d.key ? -s.sortDir : (d.desc ? -1 : 1) }))\n    }));\n  }\n\n  renderVals() {\n    const WB = window.WB;\n    const st = this.state;\n    const sheets = [\n      { id: 'summary', label: 'Summary', title: 'Summary', tag: 'Headline numbers', intro: WB ? WB.subtitle : '' },\n      { id: 'timeline', label: 'IRG Timeline', title: 'IRG request timeline', tag: '15 requests · 3 parts each', intro: 'Fifteen near-identical three-part requests, sent April 2026, covering the period 1/1/2024–4/22/2026. Click any row to read what that entity produced or denied for each part.' },\n      { id: 'stats', label: 'Agency Stats', title: \"What the agencies' own logs show\", tag: 'Volumes & response times', intro: WB ? WB.statsIntro : '' },\n      { id: 'explorer', label: 'Log Explorer', title: 'Log explorer', tag: 'Row-level distributions', intro: 'Every produced log row, aggregated: how long each office actually takes, how its volume moves month to month, and how it dispositions what it receives.' },\n      { id: 'dhs', label: 'DHS Metrics', title: \"DHS's own quarterly metrics\", tag: 'The only agency-produced averages', intro: WB ? WB.dhsNote : '' },\n      { id: 'findings', label: 'Findings Notes', title: 'Findings and anomalies', tag: 'Twelve sourced findings', intro: 'Each finding traces to a produced record, a response letter, or an email exchange in the project file.' },\n      { id: 'method', label: 'Methodology', title: 'Methodology', tag: 'Scope, window, caveats', intro: 'Scope, window, day conventions, extraction methods, and the caveats that qualify every number in this workbook.' }\n    ];\n    const cur = sheets.find(s => s.id === st.sheet) || sheets[0];\n    const base = {\n      tabs: sheets.map(s => ({\n        label: s.label,\n        bg: s.id === st.sheet ? '#FFFFFF' : 'transparent',\n        fg: s.id === st.sheet ? '#1F3864' : '#C6D2E6',\n        edge: s.id === st.sheet ? '#BF9000' : 'transparent',\n        go: () => this.setState({ sheet: s.id, q: '', sortKey: null, sortDir: 1, openRow: null })\n      })),\n      sheetTitle: cur.title, sheetTag: cur.tag, sheetIntro: cur.intro,\n      isSummary: st.sheet === 'summary', isExplorer: st.sheet === 'explorer',\n      isFindings: st.sheet === 'findings', isMethod: st.sheet === 'method',\n      isTable: st.sheet === 'timeline' || st.sheet === 'stats' || st.sheet === 'dhs',\n      q: st.q, setQ: e => this.setState({ q: e.target.value }),\n      showTop: !!st.scrolled,\n      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      toggles: []\n    };\n    if (!WB) return base;\n\n    const totalRows = Object.values(WB.logs).reduce((a, x) => a + x.all.n, 0);\n    base.totalRows = this.fmt(totalRows);\n\n    // ---- Summary\n    base.headline = WB.headline.map(h => {\n      const m = String(h.value).match(/^([\\d,.\\s\\/]+)(.*)$/);\n      const raw = m ? m[1].trim() : String(h.value);\n      return { big: /^\\d/.test(raw) ? (raw.indexOf('/') >= 0 || raw.indexOf('.') >= 0 ? raw : this.fmt(+raw)) : raw, small: m && m[2] ? m[2].trim() : '', label: h.label };\n    });\n    base.guide = WB.guide;\n    base.scopeNote = WB.scopeNote;\n    const maxRows = Math.max.apply(null, Object.values(WB.logs).map(x => x.all.n));\n    base.rowTally = Object.entries(WB.logs).sort((a, b) => b[1].all.n - a[1].all.n)\n      .map(([k, v]) => ({ name: k, count: this.fmt(v.all.n), w: (v.all.n / maxRows * 100).toFixed(1) + '%' }));\n\n    // ---- Tables\n    const q = st.q.trim().toLowerCase();\n    if (st.sheet === 'timeline') {\n      let rows = WB.timeline.filter(r => !q || (r.entity + ' ' + r.p1 + ' ' + r.p2 + ' ' + r.p3).toLowerCase().indexOf(q) >= 0);\n      rows = this.sortRows(rows, st.sortKey, st.sortDir, ['entity', 'sent', 'final']);\n      const maxCal = Math.max.apply(null, WB.timeline.map(r => r.cal || 0));\n      base.rowCountLabel = rows.length + ' of ' + WB.timeline.length + ' entities';\n      base.table = {\n        grid: 'minmax(190px, 2.1fr) 118px 132px minmax(120px, 1.5fr) 104px',\n        minWidth: '760px',\n        note: 'Calendar days measured from the date IRG sent the request to the date of the final or complete response. Business days follow NETWORKDAYS()−1. DATCP and DOR have never answered; their day counts run to today.',\n        cols: this.colDefs([\n          { label: 'Entity', key: 'entity' },\n          { label: 'Request sent', key: 'sent' },\n          { label: 'Final response', key: 'final' },\n          { label: 'Calendar days', key: 'cal', desc: true, align: 'right' },\n          { label: 'Business days', key: 'biz', desc: true, align: 'right' }\n        ]),\n        rows: rows.map(r => ({\n          bg: st.openRow === r.entity ? '#FCFDFF' : '#FFFFFF',\n          cursor: 'pointer',\n          go: () => this.setState(s => ({ openRow: s.openRow === r.entity ? null : r.entity })),\n          open: st.openRow === r.entity,\n          detail: [\n            { label: 'Part 1 — weekly snapshot / tracker', text: r.p1, edge: '#1F3864' },\n            { label: 'Part 2 — average response times', text: r.p2, edge: '#BF9000' },\n            { label: 'Part 3 — consolidated public-interest responses', text: r.p3, edge: '#B3261E' }\n          ],\n          cells: [\n            { text: r.entity, fg: '#1F3864', weight: '700', align: 'left', wrap: 'normal' },\n            { text: r.sent, fg: '#5A5A5A', align: 'left', weight: '400', wrap: 'nowrap' },\n            { text: r.silent ? 'No response' : r.final, fg: r.silent ? '#B3261E' : '#5A5A5A', align: 'left', weight: r.silent ? '700' : '400', wrap: 'nowrap' },\n            { text: r.cal == null ? '—' : this.fmt(r.cal), fg: this.dayColor(r.cal), weight: '700', align: 'right', wrap: 'nowrap', bar: true, w: ((r.cal || 0) / maxCal * 100).toFixed(1) + '%', barColor: this.dayColor(r.cal) },\n            { text: r.biz == null ? '—' : this.fmt(r.biz), fg: '#5A5A5A', align: 'right', weight: '400', wrap: 'nowrap' }\n          ]\n        }))\n      };\n    }\n\n    if (st.sheet === 'stats') {\n      let rows = WB.stats.filter(r => st.showSegs || !r.isSeg);\n      if (q) rows = rows.filter(r => r.name.toLowerCase().indexOf(q) >= 0);\n      rows = this.sortRows(rows, st.sortKey, st.sortDir, ['name']);\n      const maxTotal = Math.max.apply(null, WB.stats.map(r => (r.isRoll ? 0 : r.total) || 0));\n      base.toggles = [{\n        label: st.showSegs ? 'Segments shown' : 'Segments hidden',\n        bg: st.showSegs ? '#1F3864' : '#FFFFFF', fg: st.showSegs ? '#FFFFFF' : '#1F3864', edge: '#1F3864',\n        go: () => this.setState(s => ({ showSegs: !s.showSegs }))\n      }];\n      base.rowCountLabel = rows.length + ' rows';\n      base.table = {\n        grid: 'minmax(230px, 1.7fr) repeat(3, 62px) minmax(86px, 96px) 74px 68px 68px 76px 66px 66px 62px',\n        minWidth: '1180px',\n        note: WB.statsNote,\n        cols: this.colDefs([\n          { label: 'Agency / segment', key: 'name' },\n          { label: '2024', key: 'y24', desc: true, align: 'right' },\n          { label: '2025', key: 'y25', desc: true, align: 'right' },\n          { label: '2026', key: 'y26', desc: true, align: 'right' },\n          { label: 'Total', key: 'total', desc: true, align: 'right' },\n          { label: '% closed', key: 'complete', desc: true, align: 'right' },\n          { label: 'Median', key: 'median', desc: true, align: 'right' },\n          { label: 'Mean', key: 'mean', desc: true, align: 'right' },\n          { label: '≤10 biz', key: 'within10', desc: true, align: 'right' },\n          { label: '>30 d', key: 'over30', desc: true, align: 'right' },\n          { label: '>60 d', key: 'over60', desc: true, align: 'right' },\n          { label: 'Max', key: 'max', desc: true, align: 'right' }\n        ]),\n        rows: rows.map(r => {\n          const n = (v, s) => ({ text: v == null ? '—' : this.fmt(v) + (s || ''), fg: '#5A5A5A', align: 'right', weight: '400', wrap: 'nowrap' });\n          return {\n            bg: r.isRoll ? '#F7F9FC' : '#FFFFFF', cursor: 'default', go: null, open: false, detail: [],\n            cells: [\n              { text: r.name, fg: '#1F3864', weight: r.isSeg ? '400' : '700', align: 'left', wrap: 'normal' },\n              n(r.y24), n(r.y25), n(r.y26),\n              { text: r.total == null ? '—' : this.fmt(r.total), fg: '#1F3864', weight: '700', align: 'right', wrap: 'nowrap', bar: !r.isRoll, w: ((r.total || 0) / maxTotal * 100).toFixed(1) + '%', barColor: '#1F3864' },\n              n(r.complete, '%'),\n              { text: r.median == null ? '—' : this.fmt(r.median), fg: this.dayColor(r.median), weight: '700', align: 'right', wrap: 'nowrap' },\n              { text: r.mean == null ? '—' : this.fmt(r.mean), fg: this.dayColor(r.mean), weight: '400', align: 'right', wrap: 'nowrap' },\n              { text: r.within10 == null ? '—' : r.within10 + '%', fg: r.within10 != null && r.within10 >= 80 ? '#2E6B4F' : '#5A5A5A', weight: '400', align: 'right', wrap: 'nowrap' },\n              { text: r.over30 == null ? '—' : r.over30 + '%', fg: r.over30 != null && r.over30 >= 25 ? '#B3261E' : '#5A5A5A', weight: '400', align: 'right', wrap: 'nowrap' },\n              n(r.over60, '%'), n(r.max)\n            ]\n          };\n        })\n      };\n    }\n\n    if (st.sheet === 'dhs') {\n      let rows = WB.dhs.filter(r => !q || (r.q + ' ' + r.div).toLowerCase().indexOf(q) >= 0);\n      rows = this.sortRows(rows, st.sortKey, st.sortDir, ['q', 'div']);\n      const maxAvg = Math.max.apply(null, WB.dhs.map(r => r.avgBiz || 0));\n      base.rowCountLabel = rows.length + ' division-quarters';\n      base.table = {\n        grid: 'minmax(96px, 0.7fr) minmax(140px, 1.2fr) 106px 108px minmax(150px, 1.5fr) 128px',\n        minWidth: '820px',\n        note: (WB.dhsExtra || []).join('  ·  '),\n        cols: this.colDefs([\n          { label: 'Quarter', key: 'q' },\n          { label: 'Division / facility', key: 'div' },\n          { label: 'Received', key: 'recv', desc: true, align: 'right' },\n          { label: 'Completed', key: 'done', desc: true, align: 'right' },\n          { label: 'Avg business days', key: 'avgBiz', desc: true, align: 'right' },\n          { label: 'Ack ≤1 biz day', key: 'ack', align: 'right' }\n        ]),\n        rows: rows.map(r => ({\n          bg: '#FFFFFF', cursor: 'default', go: null, open: false, detail: [],\n          cells: [\n            { text: r.q, fg: '#1F3864', weight: '700', align: 'left', wrap: 'nowrap' },\n            { text: r.div, fg: '#23282F', weight: '400', align: 'left', wrap: 'normal' },\n            { text: this.fmt(r.recv), fg: '#5A5A5A', weight: '400', align: 'right', wrap: 'nowrap' },\n            { text: this.fmt(r.done), fg: '#5A5A5A', weight: '400', align: 'right', wrap: 'nowrap' },\n            { text: this.fmt(r.avgBiz), fg: this.dayColor(r.avgBiz), weight: '700', align: 'right', wrap: 'nowrap', bar: true, w: (r.avgBiz / maxAvg * 100).toFixed(1) + '%', barColor: this.dayColor(r.avgBiz) },\n            { text: r.ack, fg: '#2E6B4F', weight: '400', align: 'right', wrap: 'nowrap' }\n          ]\n        }))\n      };\n    }\n\n    // ---- Explorer\n    const ag = WB.logs[st.agency] ? st.agency : 'DOT';\n    const entry = WB.logs[ag];\n    const segKeys = Object.keys(entry.segments);\n    const hasSegs = segKeys.length > 1;\n    const segSel = (hasSegs && entry.segments[st.seg]) ? st.seg : 'all';\n    const A = segSel === 'all' ? entry.all : entry.segments[segSel];\n    base.agencyBtns = Object.keys(WB.logs).map(k => ({\n      label: k, bg: k === ag ? '#1F3864' : '#FFFFFF', fg: k === ag ? '#FFFFFF' : '#1F3864',\n      go: () => this.setState({ agency: k, seg: 'all' })\n    }));\n    base.hasSegments = hasSegs;\n    base.segBtns = hasSegs ? [{ key: 'all', name: 'All segments' }].concat(segKeys.map(k => ({ key: k, name: k })))\n      .map(s => ({\n        label: s.name, edge: s.key === segSel ? '#BF9000' : '#D8DEE9',\n        bg: s.key === segSel ? '#FFFDF6' : '#FFFFFF', fg: s.key === segSel ? '#8A6D00' : '#5A5A5A',\n        go: () => this.setState({ seg: s.key })\n      })) : [];\n    base.statCards = [\n      { value: this.fmt(A.n), label: 'requests received in window', color: '#1F3864' },\n      { value: A.p50 == null ? '—' : this.fmt(A.p50), label: 'median calendar days to close', color: this.dayColor(A.p50) },\n      { value: A.p90 == null ? '—' : this.fmt(A.p90), label: '90th percentile calendar days', color: this.dayColor(A.p90) },\n      { value: A.within10 == null ? '—' : A.within10 + '%', label: 'closed within 10 business days', color: A.within10 >= 80 ? '#2E6B4F' : '#B3261E' },\n      { value: A.over30 == null ? '—' : A.over30 + '%', label: 'took more than 30 calendar days', color: A.over30 >= 25 ? '#B3261E' : '#5A5A5A' },\n      { value: A.max == null ? '—' : this.fmt(A.max), label: 'longest single request, in days', color: '#B3261E' }\n    ];\n    const maxHist = Math.max.apply(null, A.hist);\n    base.hist = WB.buckets.map((label, i) => ({\n      label, count: this.fmt(A.hist[i]),\n      w: (A.hist[i] / (maxHist || 1) * 100).toFixed(1) + '%',\n      color: i <= 3 ? '#2E6B4F' : (i <= 5 ? '#BF9000' : '#B3261E')\n    }));\n    base.explorerDone = this.fmt(A.done);\n    const mKeys = Object.keys(A.months).sort();\n    const maxM = Math.max.apply(null, mKeys.map(k => A.months[k]));\n    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    const pretty = k => MN[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4);\n    base.months = mKeys.map(k => ({\n      h: Math.max(2, A.months[k] / (maxM || 1) * 100).toFixed(1) + '%',\n      color: A.months[k] === maxM ? '#B3261E' : '#1F3864',\n      title: pretty(k) + ': ' + this.fmt(A.months[k]) + ' received'\n    }));\n    base.monthFirst = mKeys.length ? pretty(mKeys[0]) : '';\n    base.monthLast = mKeys.length ? pretty(mKeys[mKeys.length - 1]) : '';\n    base.monthPeak = mKeys.length ? this.fmt(maxM) + ' in ' + pretty(mKeys.find(k => A.months[k] === maxM)) : '';\n    const maxStatus = A.status.length ? A.status[0][1] : 1;\n    base.statusRows = A.status.map(([label, count]) => ({\n      label: label === '—' ? 'Not recorded in this log' : label,\n      count: this.fmt(count), w: (count / maxStatus * 100).toFixed(1) + '%'\n    }));\n\n    // ---- Findings / Methodology\n    base.findings = WB.findings.map((f, i) => ({\n      num: String(i + 1).padStart(2, '0'), title: f.title, detail: f.detail, source: f.source,\n      open: st.openFinding === i, sign: st.openFinding === i ? '−' : '+',\n      go: () => this.setState(s => ({ openFinding: s.openFinding === i ? -1 : i }))\n    }));\n    base.method = WB.method;\n    base.methodFoot = WB.methodFoot;\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

     WHY
     The bundle sets its sans layer to "-apple-system, system-ui, Segoe UI" —
     the operating system's UI font (San Francisco on macOS, Segoe on Windows).
     That is the typeface of application chrome, and beside the Georgia
     masthead it made the page read like software rather than a publication.
     The page was inconsistent too: the masthead used the OS font while other
     labels used Arial.

     Libre Franklin is a revival of Franklin Gothic, the American newspaper and
     civic standard since 1902 — the right lineage for a public-accountability
     report, and distinct from the usual UI defaults.

     HOW
     Embedded as a data URI (~39 KB, one variable file covering every weight),
     so the page stays fully self-contained with no CDN or external request,
     matching the constraint the rest of this site is built to.

     Only elements that declare a sans stack inline are retargeted; anything
     set in Georgia keeps its serif, so the prose and the masthead title are
     untouched.

     The kicker also gains a little size and tracking (Franklin's caps run
     tighter than the OS face), and the title's cramped 2px offset from the
     kicker is opened to 7px.

     Injected into <head> from script because this page is a compiled bundle
     that clears document.body on mount.

  '.irgpdf-secondary{background:transparent;color:#FFFFFF!important;border-color:rgba(255,255,255,0.45);}' +
  '.irgpdf-secondary:hover,.irgpdf-secondary:focus-visible{background:#FFFFFF;border-color:#FFFFFF;color:#1F3864!important;}' +
  '.irgpdf:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px;}' +
  '.irgpdf .irgpdf-x{font-size:12px;line-height:1;}' +
  '@media (max-width:900px){.irgpdf{padding:8px 11px;font-size:10px;letter-spacing:.06em;}' +
    '.irgpdf + .irgpdf{margin-left:6px;}}' +
  '@media print{.irgpdf{display:none!important;}}';

  var btns = null, styleEl;

  function ensureStyle(){
    if(styleEl && styleEl.isConnected) return;
    styleEl = document.getElementById("irgpdf-style");
    if(!styleEl){
      styleEl = document.createElement("style");
      styleEl.id = "irgpdf-style";
      styleEl.appendChild(document.createTextNode(CSS));
    }
    (document.head || document.documentElement).appendChild(styleEl);
  }

  function build(){
    /* This page re-executes its inline scripts, so a second copy of this IIFE
       can run with a fresh closure. Adopt buttons already in the DOM rather
       than creating a second set. */
    var existing = document.querySelectorAll("a.irgpdf");
    if(existing.length === BUTTONS.length){ btns = Array.prototype.slice.call(existing); return; }
    btns = BUTTONS.map(function(b){
      var a = document.createElement("a");
      a.className = "irgpdf irgpdf-" + b.kind;
      a.href = b.href;
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", b.label + " (opens in a new tab)");
      var t = document.createElement("span");
      t.appendChild(document.createTextNode(b.label));
      var x = document.createElement("span");
      x.className = "irgpdf-x";
      x.setAttribute("aria-hidden", "true");
      x.appendChild(document.createTextNode("↗"));
      a.appendChild(t); a.appendChild(x);
      return a;
    });
  }

  /* The red silence chip, located by its background colour so the anchor does
     not depend on the bundle's generated class names. */
  function findChip(){
    var hdr = document.querySelector("header");
    if(!hdr) return null;
    var nodes = hdr.getElementsByTagName("div");
    for(var i=0;i<nodes.length;i++){
      var cn = nodes[i].className ? String(nodes[i].className) : "";
      if(cn.indexOf("irgpdf") === 0) continue;
      if(getComputedStyle(nodes[i]).backgroundColor === RED) return nodes[i];
    }
    return null;
  }

  function mount(){
    if(!document.body) return;
    ensureStyle();
    if(!btns) build();

    /* Cull any stray copies from another execution of this script. */
    var all = document.querySelectorAll("a.irgpdf");
    for(var k=0;k<all.length;k++){
      if(btns.indexOf(all[k]) === -1 && all[k].parentNode) all[k].parentNode.removeChild(all[k]);
    }

    var anchor = findChip();
    if(anchor){
      /* Insert in order, each after the previous. */
      for(var i=0;i<btns.length;i++){
        if(anchor.nextElementSibling !== btns[i]) anchor.insertAdjacentElement("afterend", btns[i]);
        anchor = btns[i];
      }
      return;
    }
    /* No chip on this page (or not rendered yet): fall back to the header end. */
    var hdr = document.querySelector("header");
    if(hdr){
      var bar = hdr.firstElementChild || hdr;
      for(var j=0;j<btns.length;j++){ if(!btns[j].isConnected) bar.appendChild(btns[j]); }
    }
  }

  var queued = false;
  function remount(){
    if(queued) return;
    queued = true;
    (window.requestAnimationFrame || setTimeout)(function(){ queued = false; mount(); });
  }

  function start(){
    mount();
    if(window.MutationObserver){
      new MutationObserver(remount).observe(document.documentElement, {childList:true, subtree:true});
    }
    [400, 1200, 2500].forEach(function(ms){ setTimeout(mount, ms); });
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
